name: NuGet Publish

# Reusable publish step: pushes the packed packages to a NuGet gallery using
# Trusted Publishing (OIDC), then waits until every package is restorable from
# that gallery.

on:
  workflow_call:
    inputs:
      environment:
        description: >
          GitHub environment to run the push under. Holds the Trusted Publishing
          scoping and any manual-approval gate (required reviewers).
        required: true
        type: string
      index-url:
        description: >
          V3 package source to push to. Its host is also polled (via
          /v3-flatcontainer) to confirm the packages are restorable.
        required: true
        type: string
      symbol-package-base-url:
        description: "Base URL from which the gallery's published .snupkg files can be downloaded."
        required: true
        type: string
      token-service-url:
        description: "Trusted Publishing OIDC token-exchange endpoint for this gallery."
        required: true
        type: string
      audience:
        description: >
          OIDC audience (aud claim) the gallery's token service expects. Must
          match the gallery, e.g. https://www.nuget.org for prod or
          https://int.nugettest.org for the int test server.
        required: false
        type: string
        default: https://www.nuget.org
      version:
        description: "Version expected to appear in the gallery listing."
        required: true
        type: string
      artifact-name:
        description: "Run artifact containing the .nupkg/.snupkg files to publish."
        required: false
        type: string
        default: nuget-package
      artifact-run-id:
        description: "Workflow run containing the package artifact."
        required: true
        type: string
      commit:
        description: "Exact source commit used to build the package artifact."
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write # Required for Trusted Publishing OIDC token issuance
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.artifact-name }}
          path: ${{ github.workspace }}/nuget-package
          run-id: ${{ inputs.artifact-run-id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Request the short-lived (~1h, single-use) API key immediately before the
      # push so it cannot expire in transit.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Temporal
          token-service-url: ${{ inputs.token-service-url }}
          audience: ${{ inputs.audience }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          INDEX_URL: ${{ inputs.index-url }}
        run: |
          dotnet nuget push "$GITHUB_WORKSPACE/nuget-package/**/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "$INDEX_URL" \
            --skip-duplicate

  wait:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          sparse-checkout: .github/scripts/verify-nuget-publication.sh
          sparse-checkout-cone-mode: false

      - name: Download NuGet artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.artifact-name }}
          path: ${{ github.workspace }}/nuget-package
          run-id: ${{ inputs.artifact-run-id }}

      - name: Wait for and verify packages
        env:
          VERSION: ${{ inputs.version }}
          INDEX_URL: ${{ inputs.index-url }}
          SYMBOL_PACKAGE_BASE_URL: ${{ inputs.symbol-package-base-url }}
        run: >-
          .github/scripts/verify-nuget-publication.sh
          "$GITHUB_WORKSPACE/nuget-package"
          "$INDEX_URL"
          "$SYMBOL_PACKAGE_BASE_URL"
          "$VERSION"
