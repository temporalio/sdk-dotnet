name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"
permissions:
  actions: read
  contents: read

jobs:
  build-lint-test:
    env:
      RestoreLockedMode: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-arm, macos-arm, windows-latest, windows-arm]
        include:
          - os: windows-latest
            checkTarget: true
          - os: ubuntu-latest
            docsTarget: true
          - os: ubuntu-arm
            runsOn: ubuntu-24.04-arm64-2-core
          - os: macos-arm
            runsOn: macos-14
          - os: windows-arm
            runsOn: windows-11-arm
    runs-on: ${{ matrix.runsOn || matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup

      # A core bump that changes sdk-core's workspace tables would otherwise build the bridge
      # against different versions than upstream tests with, which --locked cannot detect.
      - name: Confirm bridge workspace in sync with sdk-core
        # Compares two checked-in files, so running on one OS is sufficient.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: mise run bridge:check-sync

      - name: Regen confirm unchanged
        if: ${{ matrix.checkTarget }}
        shell: bash
        run: |
          mise run gen
          git add .
          git config --global core.safecrlf false
          git diff --cached > generator.diff
          git diff --cached --exit-code

      - name: Upload generator diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: generator-diff
          path: generator.diff
          if-no-files-found: ignore
          overwrite: true

      - name: Check format
        if: ${{ matrix.checkTarget }}
        run: dotnet format --verify-no-changes

      - name: Check release script format
        if: ${{ matrix.checkTarget }}
        run: dotnet format whitespace --folder --include scripts/release.cs --verify-no-changes

      - name: Test release tooling
        if: ${{ matrix.checkTarget }}
        run: dotnet run --file scripts/release.cs -- test

      - name: Build
        run: dotnet build

      # Minimal console verbosity keeps failures findable; the uploaded TRX still has every test's
      # output plus the dev server and core logs.
      - name: Test
        shell: bash
        run: |
          dotnet test --no-build \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory tests/Temporalio.Tests/TestResults \
            --blame-crash --blame-hang-timeout 10m

      - name: Validate package API surface
        # Package API validation runs only during the Pack target and is
        # platform-independent so running on one OS is sufficient.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet pack -c Debug --no-restore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Temporalio.Tests/TestResults/**/*.trx
          if-no-files-found: warn
          overwrite: true

      - name: Confirm bench works
        run: dotnet run --project tests/Temporalio.SimpleBench/Temporalio.SimpleBench.csproj -- --workflow-count 5 --max-cached-workflows 100 --max-concurrent 100

      - name: Upload native symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: symbols-native-${{ matrix.os }}
          if-no-files-found: error
          overwrite: true
          path: |
            src/Temporalio/Bridge/target/debug/*.dll
            src/Temporalio/Bridge/target/debug/*.dylib
            src/Temporalio/Bridge/target/debug/*.pdb
            src/Temporalio/Bridge/target/debug/*.so

      - name: Upload managed symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: symbols-managed-${{ matrix.os }}
          if-no-files-found: error
          overwrite: true
          path: |
            src/**/bin/Debug/**/*.dll
            src/**/bin/Debug/**/*.pdb

      - name: Build docs
        if: ${{ matrix.docsTarget }}
        run: mise run docs

      - name: Deploy docs
        # Only deploy on main merge, not in PRs
        if: ${{ github.ref == 'refs/heads/main' && matrix.docsTarget }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy src/Temporalio.ApiDoc/_site --token ${{ secrets.VERCEL_TOKEN }} --prod --yes

  cloud-test:
    # Secrets are unavailable to Dependabot and pull requests from forks.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event.pull_request.head.repo.full_name == '' || github.event.pull_request.head.repo.full_name == 'temporalio/sdk-dotnet') }}
    env:
      RestoreLockedMode: true
      TEMPORAL_CLIENT_CLOUD_API_VERSION: v0.19.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup

      # Required because the mTLS suite deliberately uses --no-build.
      - name: Build
        run: dotnet build

      - name: Generate Cloud test certificates
        shell: bash
        run: |
          cert_dir="$RUNNER_TEMP/cloud-test-certs"
          mkdir "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.pem" \
            -subj '/CN=Temporal .NET SDK Cloud CI CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$cert_dir/client.key" -out "$cert_dir/client.csr" \
            -subj '/CN=Temporal .NET SDK Cloud CI'
          openssl x509 -req -days 1 -in "$cert_dir/client.csr" \
            -CA "$cert_dir/ca.pem" -CAkey "$cert_dir/ca.key" -CAcreateserial \
            -out "$cert_dir/client.pem" -extfile <(printf 'extendedKeyUsage=clientAuth')
          {
            echo "TEMPORAL_CLOUD_CLIENT_CA_PATH=$cert_dir/ca.pem"
            echo "TEMPORAL_TLS_CLIENT_CERT_PATH=$cert_dir/client.pem"
            echo "TEMPORAL_TLS_CLIENT_KEY_PATH=$cert_dir/client.key"
          } >> "$GITHUB_ENV"

      - name: Create Cloud namespace (mTLS)
        id: create-mtls-namespace
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: dotnet run --project tests/Temporalio.Tests -- cloud-namespace create mtls

      - name: Test cloud (mTLS)
        env:
          TEMPORAL_TEST_ENV_CONFIG_SERVER: true
          TEMPORAL_ADDRESS: ${{ steps.create-mtls-namespace.outputs.namespace }}.tmprl.cloud:7233
          TEMPORAL_NAMESPACE: ${{ steps.create-mtls-namespace.outputs.namespace }}
        run: |
          dotnet test tests/Temporalio.Tests/Temporalio.Tests.csproj --no-build \
            --filter "CloudTest!=Excluded" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFilePrefix=cloud-mtls-results" \
            --results-directory tests/Temporalio.Tests/CloudTestResults \
            --blame-crash --blame-hang-timeout 10m

      - name: Create Cloud namespace (API key)
        id: create-api-key-namespace
        if: ${{ !cancelled() }}
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: dotnet run --project tests/Temporalio.Tests -- cloud-namespace create api-key

      # TreatNoTestsAsError keeps a renamed test from turning these narrow filters into silent
      # no-op passes.
      - name: Test cloud (API key)
        # Uses API key auth to test auto-TLS feature (TLS auto-enabled when API key provided).
        if: ${{ !cancelled() && steps.create-api-key-namespace.outcome == 'success' }}
        env:
          TEMPORAL_TEST_CLIENT_TARGET_HOST: ca-central-1.aws.api.temporal.io:7233
          TEMPORAL_TEST_CLIENT_NAMESPACE: ${{ steps.create-api-key-namespace.outputs.namespace }}
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: |
          dotnet test tests/Temporalio.Tests/Temporalio.Tests.csproj --no-build \
            --filter "FullyQualifiedName=Temporalio.Tests.Worker.WorkflowWorkerTests.ExecuteWorkflowAsync_Simple_Succeeds" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFilePrefix=cloud-api-key-results" \
            --results-directory tests/Temporalio.Tests/CloudTestResults \
            --blame-crash --blame-hang-timeout 10m \
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test cloud operations client
        if: ${{ !cancelled() && steps.create-api-key-namespace.outcome == 'success' }}
        env:
          TEMPORAL_CLIENT_CLOUD_NAMESPACE: ${{ steps.create-api-key-namespace.outputs.namespace }}
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: |
          dotnet test tests/Temporalio.Tests/Temporalio.Tests.csproj --no-build \
            --filter "FullyQualifiedName~Temporalio.Tests.Client.TemporalCloudOperationsClientTests." \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFilePrefix=cloud-operations-results" \
            --results-directory tests/Temporalio.Tests/CloudTestResults \
            --blame-crash --blame-hang-timeout 10m \
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload Cloud test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-test-results-ubuntu-latest
          path: tests/Temporalio.Tests/CloudTestResults/**/*.trx
          if-no-files-found: warn
          overwrite: true

      - name: Delete Cloud namespace (mTLS)
        id: delete-mtls-namespace
        if: ${{ always() && steps.create-mtls-namespace.outputs.namespace != '' }}
        continue-on-error: true
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: dotnet run --project tests/Temporalio.Tests -- cloud-namespace delete "${{ steps.create-mtls-namespace.outputs.namespace }}"

      - name: Delete Cloud namespace (API key)
        id: delete-api-key-namespace
        if: ${{ always() && steps.create-api-key-namespace.outputs.namespace != '' }}
        continue-on-error: true
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
        run: dotnet run --project tests/Temporalio.Tests -- cloud-namespace delete "${{ steps.create-api-key-namespace.outputs.namespace }}"

      - name: Report Cloud namespace cleanup failure
        if: ${{ always() && (steps.delete-mtls-namespace.outcome == 'failure' || steps.delete-api-key-namespace.outcome == 'failure') }}
        shell: bash
        run: |
          if [ "${{ steps.delete-mtls-namespace.outcome }}" = failure ]; then
            echo "::warning title=Cloud namespace cleanup failed::Failed to delete Cloud namespace ${{ steps.create-mtls-namespace.outputs.namespace }}"
          fi
          if [ "${{ steps.delete-api-key-namespace.outcome }}" = failure ]; then
            echo "::warning title=Cloud namespace cleanup failed::Failed to delete Cloud namespace ${{ steps.create-api-key-namespace.outputs.namespace }}"
          fi

  # Runs the sdk features repo tests with this repo's current SDK code
  features-tests:
    uses: temporalio/features/.github/workflows/dotnet.yaml@main
    with:
      dotnet-repo-path: ${{github.event.pull_request.head.repo.full_name}}
      version: ${{github.event.pull_request.head.ref}}
      version-is-repo-ref: true

  # The single required status check for merging: a PR can merge only if every job in
  # `needs` passed.
  required-pr-checks:
    name: Required PR Checks
    # Without always(), this job would be skipped when a dependency fails, and GitHub
    # treats a skipped required check as passing.
    if: always()
    needs:
      - build-lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
