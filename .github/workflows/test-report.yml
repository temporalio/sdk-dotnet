name: Test Report
on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          artifact: /test-results-(.*)/
          name: Test Results ($1)
          path: '**/*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'false'
