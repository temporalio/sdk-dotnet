version: 2
updates:
  # Routine bumps are ignored so the ~500-crate graph moves only when we choose: on an sdk-core bump
  # via `mise run bridge:relock`, or for a security advisory, which update-types ignores do not
  # suppress. Workflow determinism rides on some of these pins, so a silent patch bump is a
  # correctness risk.
  #
  # lockfile-only keeps a bot out of Bridge/Cargo.toml, whose workspace tables are mirrored from the
  # sdk-core submodule and would break `mise run bridge:check-sync` if edited here.
  - package-ecosystem: "cargo"
    directory: "/src/Temporalio/Bridge"
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows. The composite actions under
    # .github/actions pin `uses:` refs of their own, so they need their own
    # entries or those pins are never updated.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # Dependabot's NuGet updater rewrites a multi-targeted packages.lock.json from a
    # single-target restore and drops the remaining target frameworks, so version bumps are
    # made by hand instead. Security updates are exempt from this limit.
    open-pull-requests-limit: 0
    # With version updates disabled, a group can only ever apply to security updates.
    groups:
      microsoft-extensions-logging:
        applies-to: security-updates
        patterns:
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.Console"
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "OpenTelemetry*"
      # Xunit.SkippableFact is third-party and intentionally not part of this group.
      xunit:
        applies-to: security-updates
        patterns:
          - "xunit"
          - "xunit.console"
          - "xunit.runner.visualstudio"
