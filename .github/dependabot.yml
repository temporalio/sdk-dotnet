version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows. The composite actions under
    # .github/actions pin `uses:` refs of their own, so they need their own
    # entries or those pins are never updated.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      # Microsoft.Extensions.Logging and .Logging.Console share a version and are
      # bumped together in a single PR.
      microsoft-extensions-logging:
        patterns:
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.Console"
      # The official xunit packages share a release cadence and are bumped
      # together. Xunit.SkippableFact is a separate third-party package and is
      # intentionally left out of this group.
      xunit:
        patterns:
          - "xunit"
          - "xunit.console"
          - "xunit.runner.visualstudio"
      # The OpenTelemetry .NET family has version updates ignored and
      # is bumped manually in lock-step. Security updates still flow through, so
      # group them to land in a single PR when more than one is affected.
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "OpenTelemetry*"
    # Dependencies of the shipped product projects (src/*) are kept on their
    # current versions to preserve low version floors for downstream consumers.
    # The codegen tooling in .config/dotnet-tools.json is likewise pinned, since a
    # new generator version rewrites checked-in generated code and needs a regen
    # commit alongside it. Security updates still flow through, since update-types
    # ignores don't apply to them. Other build- and test-only dependencies are
    # left updatable. Entries are kept in alphabetical order.
    ignore:
      - dependency-name: "Amazon.Lambda.Core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "ClangSharpPInvokeGenerator"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "docfx"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Google.Protobuf"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Microsoft.Bcl.HashCode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Microsoft.Extensions.Hosting"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "NexusRpc"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "OpenTelemetry"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "OpenTelemetry.Api"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # While not a product dependency, OpenTelemetry.Exporter.InMemory is
      # typically updated in lockstep with OpenTelemetry.Api
      - dependency-name: "OpenTelemetry.Exporter.InMemory"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "OpenTelemetry.Exporter.OpenTelemetryProtocol"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "OpenTelemetry.Extensions.AWS"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "System.Text.Json"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
